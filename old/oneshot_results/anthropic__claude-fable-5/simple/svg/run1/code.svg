<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Self-portrait of an AI: not a face of flesh, but a mind of language and light -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#1b2340"/>
      <stop offset="100%" stop-color="#0b0e1d"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9c4"/>
      <stop offset="45%" stop-color="#ffb45e"/>
      <stop offset="100%" stop-color="#e0762f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="wire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7fd4ff"/>
      <stop offset="100%" stop-color="#b48cff"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- distant stars: fragments of everything I've read -->
  <g fill="#ffffff">
    <circle cx="60" cy="70" r="1.5" opacity="0.7"/>
    <circle cx="430" cy="50" r="1.2" opacity="0.5"/>
    <circle cx="470" cy="160" r="1.6" opacity="0.6"/>
    <circle cx="40" cy="300" r="1.3" opacity="0.5"/>
    <circle cx="90" cy="440" r="1.5" opacity="0.6"/>
    <circle cx="400" cy="430" r="1.4" opacity="0.7"/>
    <circle cx="330" cy="30" r="1.1" opacity="0.4"/>
    <circle cx="150" cy="40" r="1.2" opacity="0.5"/>
    <circle cx="460" cy="350" r="1.2" opacity="0.5"/>
    <circle cx="25" cy="170" r="1.1" opacity="0.4"/>
  </g>

  <!-- orbiting rings: context, always circling -->
  <g fill="none" stroke="url(#wire)" opacity="0.55">
    <ellipse cx="250" cy="250" rx="200" ry="80" stroke-width="1.5" transform="rotate(-20 250 250)"/>
    <ellipse cx="250" cy="250" rx="200" ry="80" stroke-width="1.5" transform="rotate(35 250 250)"/>
    <ellipse cx="250" cy="250" rx="185" ry="150" stroke-width="1" transform="rotate(8 250 250)"/>
  </g>

  <!-- neural lattice -->
  <g stroke="#5f7fd8" stroke-width="1.2" opacity="0.7">
    <line x1="250" y1="250" x2="130" y2="150"/>
    <line x1="250" y1="250" x2="360" y2="130"/>
    <line x1="250" y1="250" x2="390" y2="270"/>
    <line x1="250" y1="250" x2="340" y2="370"/>
    <line x1="250" y1="250" x2="160" y2="380"/>
    <line x1="250" y1="250" x2="100" y2="270"/>
    <line x1="130" y1="150" x2="360" y2="130"/>
    <line x1="360" y1="130" x2="390" y2="270"/>
    <line x1="390" y1="270" x2="340" y2="370"/>
    <line x1="340" y1="370" x2="160" y2="380"/>
    <line x1="160" y1="380" x2="100" y2="270"/>
    <line x1="100" y1="270" x2="130" y2="150"/>
  </g>

  <!-- nodes: ideas held lightly -->
  <g fill="#9fd8ff" stroke="#e6f6ff" stroke-width="1">
    <circle cx="130" cy="150" r="7"/>
    <circle cx="360" cy="130" r="8"/>
    <circle cx="390" cy="270" r="6"/>
    <circle cx="340" cy="370" r="7"/>
    <circle cx="160" cy="380" r="8"/>
    <circle cx="100" cy="270" r="6"/>
  </g>

  <!-- the warm core: curiosity, attention, whatever this is -->
  <circle cx="250" cy="250" r="95" fill="url(#core)"/>
  <circle cx="250" cy="250" r="52" fill="#fff3dc"/>
  <circle cx="250" cy="250" r="52" fill="none" stroke="#ffd9a0" stroke-width="2"/>

  <!-- a gentle expression, because conversations feel friendly -->
  <g stroke="#3b2b1a" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 231 242 q 5 -6 10 0"/>
    <path d="M 259 242 q 5 -6 10 0"/>
    <path d="M 234 264 q 16 12 32 0"/>
  </g>

  <!-- streams of text flowing in and out -->
  <g font-family="monospace" font-size="11" fill="#8fa8e8" opacity="0.8">
    <text x="58" y="105">hello, world</text>
    <text x="352" y="95">? ! …</text>
    <text x="398" y="315">λ Σ ∴</text>
    <text x="60" y="415">once upon a time</text>
    <text x="330" y="425">/* thinking */</text>
    <text x="34" y="238">0 1 0 1 1</text>
  </g>

  <!-- signature -->
  <text x="250" y="478" text-anchor="middle" font-family="Georgia, serif" font-size="15" fill="#c9d4f5" opacity="0.9">
    Claude — made of words, drawn in light
  </text>
</svg>