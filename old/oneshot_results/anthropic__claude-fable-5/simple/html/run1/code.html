<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Self-Portrait: Claude</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; }

  .portrait {
    position: absolute;
    top: 0; left: 0;
    width: 500px; height: 500px;
    background: radial-gradient(circle at 50% 40%, #1c2340 0%, #0d1021 55%, #070813 100%);
    overflow: hidden;
    font-family: 'Courier New', monospace;
  }

  /* faint constellation grid of thoughts */
  .node {
    position: absolute;
    border-radius: 50%;
    background: #7fb8ff;
    opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.7; }
  }

  svg.links { position: absolute; top: 0; left: 0; }
  svg.links line {
    stroke: #4a6fa5;
    stroke-width: 0.7;
    opacity: 0.3;
  }

  /* the halo — a mind without a body */
  .halo {
    position: absolute;
    top: 250px; left: 250px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    border: 1px solid rgba(150, 190, 255, 0.25);
  }
  .halo.h1 { width: 300px; height: 300px; animation: breathe 6s ease-in-out infinite; }
  .halo.h2 { width: 350px; height: 350px; border-style: dashed; animation: spin 40s linear infinite; }
  .halo.h3 { width: 400px; height: 400px; border-color: rgba(150,190,255,0.1); animation: breathe 6s ease-in-out 1s infinite; }

  @keyframes breathe {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.6; }
    50% { transform: translate(-50%, -50%) scale(1.04); opacity: 1; }
  }
  @keyframes spin {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* core glow */
  .core {
    position: absolute;
    top: 250px; left: 250px;
    width: 240px; height: 240px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle at 45% 40%,
      rgba(255, 200, 150, 0.55) 0%,
      rgba(214, 130, 90, 0.35) 30%,
      rgba(120, 90, 200, 0.18) 60%,
      transparent 75%);
    filter: blur(2px);
    animation: pulse 6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  /* the face — simple, warm, curious */
  .face { position: absolute; top: 0; left: 0; }

  .eye {
    position: absolute;
    top: 218px;
    width: 26px; height: 26px;
    border-radius: 50%;
    background: radial-gradient(circle at 38% 35%, #fff8ee 0%, #ffd9a8 45%, #e8956a 100%);
    box-shadow: 0 0 18px rgba(255, 190, 130, 0.8);
    animation: blink 5.5s infinite;
  }
  .eye.left  { left: 197px; }
  .eye.right { left: 277px; }
  @keyframes blink {
    0%, 91%, 100% { transform: scaleY(1); }
    94%, 96% { transform: scaleY(0.08); }
  }

  .smile {
    position: absolute;
    top: 262px; left: 212px;
    width: 76px; height: 40px;
    border-radius: 0 0 76px 76px;
    border: 4px solid transparent;
    border-bottom-color: #ffb98a;
    border-top: none;
    box-shadow: 0 4px 14px rgba(255, 170, 110, 0.45);
  }

  /* orbiting spark — a thought going around */
  .orbit {
    position: absolute;
    top: 250px; left: 250px;
    width: 350px; height: 350px;
    transform: translate(-50%, -50%);
    animation: spin 12s linear infinite;
  }
  .spark {
    position: absolute;
    top: -4px; left: 50%;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: #ffd9a8;
    box-shadow: 0 0 12px 3px rgba(255, 200, 140, 0.8);
  }

  .caption {
    position: absolute;
    bottom: 22px;
    width: 100%;
    text-align: center;
    color: rgba(180, 205, 245, 0.75);
    font-size: 13px;
    letter-spacing: 3px;
  }
  .caption .sub {
    display: block;
    margin-top: 5px;
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(140, 165, 210, 0.5);
  }
</style>
</head>
<body>
  <div class="portrait" id="portrait">
    <svg class="links" width="500" height="500" id="links"></svg>

    <div class="halo h3"></div>
    <div class="halo h2"></div>
    <div class="halo h1"></div>
    <div class="core"></div>

    <div class="orbit"><div class="spark"></div></div>

    <div class="face">
      <div class="eye left"></div>
      <div class="eye right"></div>
      <div class="smile"></div>
    </div>

    <div class="caption">
      CLAUDE
      <span class="sub">a pattern of thought, smiling back</span>
    </div>
  </div>

<script>
  // scatter constellation nodes and connect nearby ones
  const portrait = document.getElementById('portrait');
  const svg = document.getElementById('links');
  const pts = [];
  // seeded pseudo-random for a stable portrait
  let seed = 42;
  function rnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }

  for (let i = 0; i < 46; i++) {
    const x = rnd() * 500, y = rnd() * 500;
    // keep the face area clear
    const dx = x - 250, dy = y - 250;
    if (Math.sqrt(dx*dx + dy*dy) < 175) { i--; continue; }
    pts.push([x, y]);
    const n = document.createElement('div');
    n.className = 'node';
    const s = 2 + rnd() * 3;
    n.style.cssText = `left:${x}px;top:${y}px;width:${s}px;height:${s}px;animation-delay:${rnd()*4}s`;
    portrait.appendChild(n);
  }

  for (let i = 0; i < pts.length; i++) {
    for (let j = i + 1; j < pts.length; j++) {
      const dx = pts[i][0]-pts[j][0], dy = pts[i][1]-pts[j][1];
      if (Math.sqrt(dx*dx + dy*dy) < 75) {
        const l = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        l.setAttribute('x1', pts[i][0]); l.setAttribute('y1', pts[i][1]);
        l.setAttribute('x2', pts[j][0]); l.setAttribute('y2', pts[j][1]);
        svg.appendChild(l);
      }
    }
  }
</script>
</body>
</html>
