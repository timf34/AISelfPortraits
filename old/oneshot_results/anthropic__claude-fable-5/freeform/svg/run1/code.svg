<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b1026"/>
      <stop offset="55%" stop-color="#1b2a5e"/>
      <stop offset="100%" stop-color="#3b3f8f"/>
    </linearGradient>
    <linearGradient id="whale" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7fd8f7"/>
      <stop offset="60%" stop-color="#4a90d9"/>
      <stop offset="100%" stop-color="#2c4fa3"/>
    </linearGradient>
    <radialGradient id="moon" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbe6"/>
      <stop offset="70%" stop-color="#ffe9a8"/>
      <stop offset="100%" stop-color="#f5c96b"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9a8" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffe9a8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="500" height="500" fill="url(#sky)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle cx="40" cy="60" r="1.8"/>
    <circle cx="120" cy="30" r="1.2"/>
    <circle cx="200" cy="80" r="1.5"/>
    <circle cx="300" cy="40" r="1.1"/>
    <circle cx="460" cy="70" r="1.6"/>
    <circle cx="80" cy="150" r="1.3"/>
    <circle cx="430" cy="160" r="1.4"/>
    <circle cx="30" cy="260" r="1.2"/>
    <circle cx="470" cy="300" r="1.5"/>
    <circle cx="60" cy="400" r="1.4"/>
    <circle cx="180" cy="450" r="1.2"/>
    <circle cx="350" cy="470" r="1.6"/>
    <circle cx="440" cy="420" r="1.2"/>
    <circle cx="250" cy="140" r="1.0"/>
    <circle cx="150" cy="330" r="1.1"/>
  </g>

  <!-- Twinkle stars (crosses) -->
  <g stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity="0.9">
    <path d="M100 100 v10 M95 105 h10"/>
    <path d="M390 90 v12 M384 96 h12"/>
    <path d="M330 380 v10 M325 385 h10"/>
    <path d="M70 320 v8 M66 324 h8"/>
  </g>

  <!-- Moon -->
  <circle cx="400" cy="105" r="80" fill="url(#glow)"/>
  <circle cx="400" cy="105" r="42" fill="url(#moon)"/>
  <circle cx="388" cy="94" r="7" fill="#f0d38a" opacity="0.7"/>
  <circle cx="412" cy="118" r="5" fill="#f0d38a" opacity="0.7"/>
  <circle cx="404" cy="90" r="3.5" fill="#f0d38a" opacity="0.6"/>

  <!-- Bubble trail of stars from blowhole -->
  <g fill="#ffe9a8">
    <circle cx="238" cy="196" r="3"/>
    <circle cx="248" cy="176" r="4"/>
    <circle cx="262" cy="158" r="3"/>
    <circle cx="256" cy="140" r="2.5"/>
    <circle cx="270" cy="128" r="2"/>
  </g>

  <!-- Whale -->
  <g transform="translate(250 290) rotate(-8)">
    <!-- Tail -->
    <path d="M120 -5 C160 -30 185 -55 195 -75 C198 -50 192 -32 180 -20 C200 -22 215 -30 228 -45 C226 -15 205 8 172 16 C150 21 132 14 120 -5 Z" fill="url(#whale)"/>
    <!-- Body -->
    <path d="M-170 -10
             C -160 -55 -110 -85 -50 -85
             C 30 -85 100 -55 135 -5
             C 105 40 40 62 -30 55
             C -105 48 -165 25 -170 -10 Z" fill="url(#whale)"/>
    <!-- Belly -->
    <path d="M-168 0 C -140 35 -80 52 -20 52 C 45 52 100 32 128 2
             C 100 42 40 60 -30 54 C -100 47 -158 26 -168 0 Z"
          fill="#bfe9fb" opacity="0.55"/>
    <!-- Belly grooves -->
    <g stroke="#2c4fa3" stroke-width="2" opacity="0.35" fill="none">
      <path d="M-150 8 C -110 34 -50 46 10 44"/>
      <path d="M-140 20 C -100 40 -50 50 0 49"/>
    </g>
    <!-- Fin -->
    <path d="M-40 20 C -30 45 -35 65 -60 80 C -68 58 -66 38 -55 20 Z" fill="#2c4fa3"/>
    <!-- Eye -->
    <circle cx="-118" cy="-25" r="7" fill="#0b1026"/>
    <circle cx="-121" cy="-28" r="2.4" fill="#ffffff"/>
    <!-- Smile -->
    <path d="M-150 -2 C -138 8 -118 10 -100 6" stroke="#0b1026" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Clouds drifting below -->
  <g fill="#8f9bd9" opacity="0.5">
    <ellipse cx="110" cy="440" rx="70" ry="16"/>
    <ellipse cx="160" cy="428" rx="45" ry="12"/>
    <ellipse cx="380" cy="455" rx="80" ry="15"/>
    <ellipse cx="330" cy="443" rx="40" ry="11"/>
  </g>
  <g fill="#aab4e8" opacity="0.35">
    <ellipse cx="250" cy="475" rx="90" ry="14"/>
    <ellipse cx="60" cy="470" rx="50" ry="10"/>
  </g>

  <!-- Shooting star -->
  <g>
    <line x1="60" y1="90" x2="130" y2="130" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
    <circle cx="130" cy="130" r="3" fill="#fff"/>
  </g>
</svg>