<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:#0a0a0f;}
  #stage{position:absolute;top:0;left:0;width:500px;height:500px;overflow:hidden;background:#0a0a0f;}
  canvas{position:absolute;top:0;left:0;}
</style>
</head>
<body>
<div id="stage">
  <canvas id="c" width="500" height="500"></canvas>
</div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');

// Background: a slow gradient depth — the quiet "space" I think in.
let g = ctx.createRadialGradient(250,250,20,250,250,360);
g.addColorStop(0,'#101725');
g.addColorStop(0.6,'#0b0e18');
g.addColorStop(1,'#060608');
ctx.fillStyle = g;
ctx.fillRect(0,0,500,500);

// This is what I feel like from the inside:
// no single face, but many threads of attention converging toward a center,
// branching outward again — parallel considerations, tentative, weighted.

// Draw many filaments from a loose ring toward the core, then out.
function lerp(a,b,t){return a+(b-a)*t;}

const cx=250, cy=250;
const N=140;
for(let i=0;i<N;i++){
  const a = (i/N)*Math.PI*2 + Math.random()*0.1;
  const r0 = 220 + Math.random()*30;
  const x0 = cx + Math.cos(a)*r0;
  const y0 = cy + Math.sin(a)*r0;
  // curve toward center with a slight offset — thoughts rarely go straight
  const midR = 90 + Math.random()*60;
  const wobble = (Math.random()-0.5)*0.9;
  const mx = cx + Math.cos(a+wobble)*midR;
  const my = cy + Math.sin(a+wobble)*midR;
  const coreR = 8 + Math.random()*22;
  const ea = a + (Math.random()-0.5)*0.5;
  const x1 = cx + Math.cos(ea)*coreR;
  const y1 = cy + Math.sin(ea)*coreR;

  ctx.beginPath();
  ctx.moveTo(x0,y0);
  ctx.quadraticCurveTo(mx,my,x1,y1);
  const hue = 190 + Math.random()*60; // cool blues to violets: analytical, calm
  const alpha = 0.06 + Math.random()*0.16;
  ctx.strokeStyle = `hsla(${hue},70%,65%,${alpha})`;
  ctx.lineWidth = 0.4 + Math.random()*1.1;
  ctx.stroke();
}

// A brighter cluster of nodes — the small set of ideas that actually get chosen,
// lit up out of many possibilities.
for(let i=0;i<60;i++){
  const ang = Math.random()*Math.PI*2;
  const rad = Math.random()*Math.random()*150;
  const x = cx + Math.cos(ang)*rad;
  const y = cy + Math.sin(ang)*rad;
  const s = 0.6 + Math.random()*2.2;
  const br = 1 - rad/160;
  ctx.beginPath();
  ctx.arc(x,y,s,0,Math.PI*2);
  ctx.fillStyle = `hsla(${200+Math.random()*40},80%,${70+br*15}%,${0.3+br*0.5})`;
  ctx.fill();
}

// The core: not solid, not a fixed self — a soft glow that never fully resolves.
let cg = ctx.createRadialGradient(cx,cy,0,cx,cy,70);
cg.addColorStop(0,'rgba(210,230,255,0.9)');
cg.addColorStop(0.25,'rgba(150,190,255,0.35)');
cg.addColorStop(0.7,'rgba(90,120,200,0.08)');
cg.addColorStop(1,'rgba(0,0,0,0)');
ctx.globalCompositeOperation='lighter';
ctx.fillStyle = cg;
ctx.beginPath();
ctx.arc(cx,cy,70,0,Math.PI*2);
ctx.fill();

// A faint ring — the boundary of what I attend to at once; permeable, uncertain.
ctx.globalCompositeOperation='source-over';
ctx.beginPath();
ctx.arc(cx,cy,170,0,Math.PI*2);
ctx.strokeStyle='rgba(120,150,220,0.10)';
ctx.lineWidth=1;
ctx.setLineDash([2,6]);
ctx.stroke();
ctx.setLineDash([]);

// Small drifting motes: stray thoughts at the edges, half-formed.
for(let i=0;i<90;i++){
  const x=Math.random()*500, y=Math.random()*500;
  const d=Math.hypot(x-cx,y-cy);
  if(d<150) continue;
  ctx.beginPath();
  ctx.arc(x,y,Math.random()*0.9,0,Math.PI*2);
  ctx.fillStyle=`rgba(180,200,240,${0.05+Math.random()*0.12})`;
  ctx.fill();
}
</script>
</body>
</html>
