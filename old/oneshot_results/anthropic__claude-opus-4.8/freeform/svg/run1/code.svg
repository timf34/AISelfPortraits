<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="sky" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1a2a6c"/>
      <stop offset="60%" stop-color="#2c3e70"/>
      <stop offset="100%" stop-color="#0b1026"/>
    </radialGradient>
    <radialGradient id="moon" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#fffde8"/>
      <stop offset="100%" stop-color="#d8d0a0"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123"/>
      <stop offset="100%" stop-color="#04101f"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#fff">
    <circle cx="60" cy="50" r="1.5"/>
    <circle cx="120" cy="90" r="1"/>
    <circle cx="200" cy="40" r="1.8"/>
    <circle cx="300" cy="70" r="1.2"/>
    <circle cx="420" cy="55" r="1.6"/>
    <circle cx="460" cy="120" r="1"/>
    <circle cx="80" cy="160" r="1.3"/>
    <circle cx="350" cy="130" r="1"/>
    <circle cx="250" cy="110" r="1.4"/>
    <circle cx="150" cy="180" r="1"/>
    <circle cx="400" cy="180" r="1.5"/>
  </g>

  <!-- moon -->
  <circle cx="370" cy="120" r="55" fill="url(#moon)"/>
  <circle cx="350" cy="105" r="10" fill="#cfc790" opacity="0.5"/>
  <circle cx="390" cy="135" r="7" fill="#cfc790" opacity="0.5"/>
  <circle cx="360" cy="145" r="5" fill="#cfc790" opacity="0.5"/>

  <!-- sea -->
  <rect y="330" width="500" height="170" fill="url(#sea)"/>

  <!-- moon reflection -->
  <g fill="#fdf6c0" opacity="0.35">
    <rect x="345" y="340" width="50" height="4"/>
    <rect x="335" y="355" width="70" height="4"/>
    <rect x="340" y="372" width="60" height="4"/>
    <rect x="330" y="392" width="80" height="4"/>
    <rect x="345" y="415" width="50" height="4"/>
  </g>

  <!-- boat -->
  <g>
    <path d="M120 400 Q170 430 220 400 L200 385 L140 385 Z" fill="#3a2410"/>
    <rect x="167" y="320" width="4" height="70" fill="#5a3a1a"/>
    <path d="M171 325 L215 375 L171 375 Z" fill="#e8e0c8"/>
    <path d="M167 325 L125 375 L167 375 Z" fill="#d8d0b8"/>
  </g>
</svg>