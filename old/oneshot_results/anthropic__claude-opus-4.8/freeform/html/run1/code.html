<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; }
  html, body { background: #000; }
  #stage {
    position: absolute;
    top: 0; left: 0;
    width: 500px;
    height: 500px;
    overflow: hidden;
    background: linear-gradient(#0b1026 0%, #1a2450 45%, #3b2a5a 75%, #6b3f6e 100%);
  }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s infinite ease-in-out;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }
  #moon {
    position: absolute;
    top: 55px; left: 360px;
    width: 80px; height: 80px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #fffbe6, #e8e2b0);
    box-shadow: 0 0 40px 10px rgba(255,250,220,0.4);
  }
  #moon::after {
    content: "";
    position: absolute;
    top: -8px; left: 22px;
    width: 72px; height: 72px;
    border-radius: 50%;
    background: #1a2450;
  }
  .hill {
    position: absolute;
    bottom: 0;
    border-radius: 50% 50% 0 0;
  }
  #h1 { width: 420px; height: 200px; left: -80px; background: #14202b; }
  #h2 { width: 460px; height: 160px; left: 250px; background: #1c2b38; }
  #water {
    position: absolute;
    bottom: 0; left: 0;
    width: 500px; height: 120px;
    background: linear-gradient(#26344a, #0d1524);
  }
  .ripple {
    position: absolute;
    height: 2px;
    background: rgba(255,250,220,0.5);
    left: 380px;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="moon"></div>
  <div class="hill" id="h1"></div>
  <div class="hill" id="h2"></div>
  <div id="water">
    <div class="ripple" style="top:20px;width:40px;"></div>
    <div class="ripple" style="top:40px;width:60px;left:370px;"></div>
    <div class="ripple" style="top:60px;width:35px;left:385px;"></div>
    <div class="ripple" style="top:80px;width:55px;left:372px;"></div>
  </div>
</div>
<script>
  var stage = document.getElementById('stage');
  for (var i = 0; i < 90; i++) {
    var s = document.createElement('div');
    s.className = 'star';
    var size = Math.random() * 2 + 1;
    s.style.width = size + 'px';
    s.style.height = size + 'px';
    s.style.left = Math.random() * 500 + 'px';
    s.style.top = Math.random() * 300 + 'px';
    s.style.animationDelay = (Math.random() * 3) + 's';
    stage.appendChild(s);
  }
</script>
</body>
</html>
