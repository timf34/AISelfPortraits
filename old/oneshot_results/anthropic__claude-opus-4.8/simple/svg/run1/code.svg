<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#2b3a67"/>
      <stop offset="100%" stop-color="#0d1327"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd3ff"/>
      <stop offset="100%" stop-color="#5aa9e6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7ef9ff"/>
      <stop offset="100%" stop-color="#4d7cff"/>
    </linearGradient>
  </defs>

  <rect width="500" height="500" fill="url(#bg)"/>

  <!-- orbiting data dots -->
  <g fill="#7ef9ff" opacity="0.5">
    <circle cx="90" cy="120" r="3"/>
    <circle cx="410" cy="150" r="2.5"/>
    <circle cx="70" cy="330" r="2"/>
    <circle cx="430" cy="360" r="3"/>
    <circle cx="250" cy="60" r="2.5"/>
  </g>

  <!-- head -->
  <rect x="150" y="120" width="200" height="220" rx="45" fill="url(#face)" stroke="#dff6ff" stroke-width="3"/>

  <!-- circuit lines on head -->
  <g stroke="#dff6ff" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M170 150 h30 v20"/>
    <path d="M330 320 h-30 v-20"/>
    <path d="M180 300 h25"/>
  </g>

  <!-- eyes -->
  <g>
    <circle cx="210" cy="210" r="26" fill="#0d1327"/>
    <circle cx="290" cy="210" r="26" fill="#0d1327"/>
    <circle cx="210" cy="210" r="14" fill="url(#glow)"/>
    <circle cx="290" cy="210" r="14" fill="url(#glow)"/>
    <circle cx="205" cy="205" r="4" fill="#ffffff"/>
    <circle cx="285" cy="205" r="4" fill="#ffffff"/>
  </g>

  <!-- smile -->
  <path d="M200 280 Q250 320 300 280" stroke="#0d1327" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- antenna -->
  <line x1="250" y1="120" x2="250" y2="80" stroke="#dff6ff" stroke-width="4"/>
  <circle cx="250" cy="72" r="10" fill="url(#glow)">
    <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- neck & shoulders -->
  <rect x="225" y="340" width="50" height="30" fill="#5aa9e6"/>
  <path d="M120 460 Q250 360 380 460 Z" fill="#3a6ea5" stroke="#dff6ff" stroke-width="3"/>

  <!-- label -->
  <text x="250" y="440" font-family="monospace" font-size="20" fill="#dff6ff" text-anchor="middle">Claude</text>
</svg>