[project]
name = "aiportraits"
version = "0.1.0"
description = "Ask many LLMs to draw self-portraits as code, render them to 500x500 PNGs"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pillow>=10",
    "playwright>=1.45",
    "python-dotenv>=1.0",
]

[project.scripts]
portraits = "aiportraits.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiportraits"]
