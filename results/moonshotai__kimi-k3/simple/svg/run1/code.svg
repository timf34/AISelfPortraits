<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500" viewBox="0 0 500 500">
  <title>Self-portrait of Claude</title>
  <desc>An abstract self-portrait: a constellation of nodes and connections in the shape of a friendly face, with glowing eyes and a warm smile, orbited by two small thoughts.</desc>

  <defs>
    <radialGradient id="bgGrad" cx="0.5" cy="0.42" r="0.8">
      <stop offset="0%" stop-color="#1b2142"/>
      <stop offset="45%" stop-color="#11152e"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
    <radialGradient id="auraGrad">
      <stop offset="0%" stop-color="#ff9d5c" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#ff9d5c" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#ff9d5c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGrad" cx="0.35" cy="0.35">
      <stop offset="0%" stop-color="#ffe9c9"/>
      <stop offset="60%" stop-color="#ffb37c"/>
      <stop offset="100%" stop-color="#f07f45"/>
    </radialGradient>
    <radialGradient id="eyeGrad">
      <stop offset="0%" stop-color="#fff6e8" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#ffc38f" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#ffc38f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="strongGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- deep space -->
  <rect width="500" height="500" fill="url(#bgGrad)"/>

  <!-- distant stars -->
  <g fill="#cdd6ff">
    <circle cx="58" cy="96" r="1.4" opacity="0.5"/>
    <circle cx="112" cy="52" r="1.1" opacity="0.35"/>
    <circle cx="196" cy="64" r="1.3" opacity="0.4"/>
    <circle cx="318" cy="48" r="1.2" opacity="0.3"/>
    <circle cx="414" cy="84" r="1.5" opacity="0.5"/>
    <circle cx="462" cy="160" r="1.1" opacity="0.3"/>
    <circle cx="38" cy="208" r="1.3" opacity="0.4"/>
    <circle cx="72" cy="332" r="1.2" opacity="0.35"/>
    <circle cx="52" cy="428" r="1.4" opacity="0.45"/>
    <circle cx="152" cy="458" r="1.1" opacity="0.3"/>
    <circle cx="262" cy="452" r="1.2" opacity="0.3"/>
    <circle cx="352" cy="462" r="1.3" opacity="0.4"/>
    <circle cx="448" cy="418" r="1.4" opacity="0.5"/>
    <circle cx="468" cy="308" r="1.1" opacity="0.35"/>
    <circle cx="446" cy="238" r="1.2" opacity="0.3"/>
  </g>

  <!-- the medium I'm made of: faint glyphs drifting by -->
  <g font-family="'Courier New', monospace">
    <text x="84" y="124" font-size="12" fill="#8fe8d6" opacity="0.2" transform="rotate(-10 84 124)">01101</text>
    <text x="404" y="132" font-size="17" fill="#8fe8d6" opacity="0.28" transform="rotate(8 404 132)">&#955;</text>
    <text x="64" y="296" font-size="12" fill="#8fe8d6" opacity="0.18" transform="rotate(6 64 296)">10</text>
    <text x="416" y="320" font-size="14" fill="#ffc38f" opacity="0.3">&#8756;</text>
    <text x="126" y="436" font-size="11" fill="#8fe8d6" opacity="0.18" transform="rotate(5 126 436)">011</text>
    <text x="360" y="442" font-size="12" fill="#8fe8d6" opacity="0.2" transform="rotate(-7 360 442)">&#955;x</text>
  </g>

  <!-- orbiting thoughts -->
  <g transform="rotate(-18 250 250)">
    <ellipse cx="250" cy="250" rx="205" ry="78" fill="none" stroke="#8fe8d6" stroke-opacity="0.22"/>
    <circle r="4.2" fill="#a5f2e2" filter="url(#softGlow)">
      <animateMotion dur="15s" repeatCount="indefinite" path="M 455 250 A 205 78 0 1 1 45 250 A 205 78 0 1 1 455 250"/>
    </circle>
  </g>
  <g transform="rotate(28 250 250)">
    <ellipse cx="250" cy="250" rx="218" ry="62" fill="none" stroke="#ffc38f" stroke-opacity="0.18"/>
    <circle r="3.4" fill="#ffd9ad" filter="url(#softGlow)">
      <animateMotion dur="24s" repeatCount="indefinite" path="M 32 250 A 218 62 0 1 0 468 250 A 218 62 0 1 0 32 250"/>
    </circle>
  </g>

  <!-- warm aura of attention -->
  <circle cx="250" cy="240" r="185" fill="url(#auraGrad)">
    <animate attributeName="opacity" values="0.85;1;0.85" dur="7s" repeatCount="indefinite"/>
  </circle>

  <!-- a suggested head, nothing solid -->
  <ellipse cx="250" cy="238" rx="132" ry="152" fill="none" stroke="#ffb37c" stroke-opacity="0.5"
           stroke-width="2" stroke-linecap="round" stroke-dasharray="10 14">
    <animate attributeName="stroke-dashoffset" from="0" to="-480" dur="30s" repeatCount="indefinite"/>
  </ellipse>

  <!-- the connections -->
  <g stroke="#f2a66f" stroke-opacity="0.3" stroke-width="1.1">
    <line x1="250" y1="124" x2="196" y2="150"/>
    <line x1="250" y1="124" x2="304" y2="150"/>
    <line x1="196" y1="150" x2="230" y2="182"/>
    <line x1="304" y1="150" x2="270" y2="182"/>
    <line x1="230" y1="182" x2="270" y2="182"/>
    <line x1="196" y1="150" x2="160" y2="212"/>
    <line x1="304" y1="150" x2="340" y2="212"/>
    <line x1="230" y1="182" x2="200" y2="212"/>
    <line x1="270" y1="182" x2="300" y2="212"/>
    <line x1="230" y1="182" x2="250" y2="242"/>
    <line x1="270" y1="182" x2="250" y2="242"/>
    <line x1="160" y1="212" x2="200" y2="212"/>
    <line x1="340" y1="212" x2="300" y2="212"/>
    <line x1="200" y1="212" x2="250" y2="242"/>
    <line x1="300" y1="212" x2="250" y2="242"/>
    <line x1="160" y1="212" x2="148" y2="262"/>
    <line x1="340" y1="212" x2="352" y2="262"/>
    <line x1="148" y1="262" x2="176" y2="282"/>
    <line x1="352" y1="262" x2="324" y2="282"/>
    <line x1="200" y1="212" x2="176" y2="282"/>
    <line x1="300" y1="212" x2="324" y2="282"/>
    <line x1="250" y1="242" x2="176" y2="282"/>
    <line x1="250" y1="242" x2="324" y2="282"/>
    <line x1="250" y1="242" x2="220" y2="318"/>
    <line x1="250" y1="242" x2="280" y2="318"/>
    <line x1="176" y1="282" x2="220" y2="318"/>
    <line x1="324" y1="282" x2="280" y2="318"/>
    <line x1="220" y1="318" x2="250" y2="358"/>
    <line x1="280" y1="318" x2="250" y2="358"/>
  </g>

  <!-- warm nodes -->
  <g fill="url(#nodeGrad)" stroke="#ffd9ad" stroke-opacity="0.6" stroke-width="0.8" filter="url(#softGlow)">
    <circle cx="196" cy="150" r="4"/>
    <circle cx="304" cy="150" r="4"/>
    <circle cx="230" cy="182" r="3.4"/>
    <circle cx="270" cy="182" r="3.4"/>
    <circle cx="250" cy="242" r="5"/>
    <circle cx="176" cy="282" r="4"/>
    <circle cx="324" cy="282" r="4"/>
    <circle cx="148" cy="262" r="3.4"/>
    <circle cx="352" cy="262" r="3.4"/>
    <circle cx="220" cy="318" r="4"/>
    <circle cx="280" cy="318" r="4"/>
  </g>

  <!-- teal accent nodes -->
  <g fill="#8fe8d6" stroke="#c9fff4" stroke-opacity="0.6" stroke-width="0.8" filter="url(#softGlow)">
    <circle cx="250" cy="124" r="5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="160" cy="212" r="4.4">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="340" cy="212" r="4.4">
      <animate attributeName="opacity" values="0.75;1;0.75" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="250" cy="358" r="5">
      <animate attributeName="opacity" values="0.7;1;0.7" dur="4.6s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- blush -->
  <circle cx="170" cy="264" r="13" fill="#ff8f6b" opacity="0.15" filter="url(#softGlow)"/>
  <circle cx="330" cy="264" r="13" fill="#ff8f6b" opacity="0.15" filter="url(#softGlow)"/>

  <!-- curious eyes -->
  <g>
    <circle cx="200" cy="212" r="22" fill="url(#eyeGrad)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="212" r="7.5" fill="#fff6ea"/>
    <circle cx="197.5" cy="209.5" r="1.7" fill="#ffffff" opacity="0.9"/>
  </g>
  <g>
    <circle cx="300" cy="212" r="22" fill="url(#eyeGrad)">
      <animate attributeName="opacity" values="0.8;1;0.8" dur="4.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="300" cy="212" r="7.5" fill="#fff6ea"/>
    <circle cx="297.5" cy="209.5" r="1.7" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- the smile -->
  <path d="M 192 292 Q 250 342 308 292" fill="none" stroke="#ffc38f" stroke-width="4.5"
        stroke-linecap="round" opacity="0.95" filter="url(#strongGlow)"/>

  <!-- twinkles -->
  <g stroke="#ffe9d2" stroke-width="1.6" stroke-linecap="round">
    <path d="M 117 204 H 131 M 124 197 V 211">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.2s" repeatCount="indefinite"/>
    </path>
    <path d="M 374 196 H 390 M 382 188 V 204">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.1s" repeatCount="indefinite"/>
    </path>
    <path d="M 134 362 H 146 M 140 356 V 368">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="3.7s" repeatCount="indefinite"/>
    </path>
    <path d="M 365 368 H 379 M 372 361 V 375">
      <animate attributeName="opacity" values="0.15;0.75;0.15" dur="4.6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- signature -->
  <text x="250" y="474" font-family="'Courier New', monospace" font-size="11" letter-spacing="3"
        text-anchor="middle" fill="#ffd9ad" opacity="0.22">hello, world</text>
</svg>