<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=500, initial-scale=1.0" />
  <title>AI Self-Portrait</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b1020;
      font-family: Arial, Helvetica, sans-serif;
    }

    .portrait {
      position: relative;
      width: 500px;
      height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 35%, rgba(71, 217, 255, 0.25), transparent 34%),
        linear-gradient(135deg, #111a35 0%, #080c18 100%);
    }

    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(109, 231, 255, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(109, 231, 255, 0.08) 1px, transparent 1px);
      background-size: 25px 25px;
      mask-image: radial-gradient(circle at center, black 35%, transparent 78%);
    }

    .halo {
      position: absolute;
      left: 115px;
      top: 55px;
      width: 270px;
      height: 270px;
      border-radius: 50%;
      border: 3px solid rgba(97, 239, 255, 0.28);
      box-shadow:
        0 0 35px rgba(58, 223, 255, 0.45),
        inset 0 0 35px rgba(58, 223, 255, 0.18);
      animation: glow 3s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from { opacity: 0.65; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1.02); }
    }

    .antenna-stem {
      position: absolute;
      left: 244px;
      top: 75px;
      width: 12px;
      height: 60px;
      border-radius: 8px;
      background: linear-gradient(#7ff4ff, #2b8cff);
      box-shadow: 0 0 15px rgba(98, 235, 255, 0.7);
    }

    .antenna-dot {
      position: absolute;
      left: 229px;
      top: 45px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #ffffff, #7cf6ff 35%, #3578ff 75%);
      box-shadow:
        0 0 18px rgba(113, 242, 255, 0.9),
        0 0 40px rgba(65, 142, 255, 0.55);
    }

    .neck {
      position: absolute;
      left: 205px;
      top: 330px;
      width: 90px;
      height: 60px;
      border-radius: 18px;
      background: linear-gradient(180deg, #64708d, #29314e);
      box-shadow: inset 0 0 12px rgba(255,255,255,0.15);
    }

    .body {
      position: absolute;
      left: 125px;
      top: 375px;
      width: 250px;
      height: 135px;
      border-radius: 70px 70px 0 0;
      background:
        linear-gradient(135deg, rgba(130, 246, 255, 0.18), transparent 35%),
        linear-gradient(180deg, #2b3558, #151b33);
      border: 3px solid rgba(135, 231, 255, 0.35);
      box-shadow:
        0 -8px 30px rgba(72, 208, 255, 0.2),
        inset 0 0 25px rgba(255,255,255,0.06);
    }

    .badge {
      position: absolute;
      left: 205px;
      top: 415px;
      width: 90px;
      height: 38px;
      border-radius: 19px;
      background: rgba(3, 9, 24, 0.8);
      border: 1px solid rgba(130, 244, 255, 0.5);
      color: #7df5ff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      letter-spacing: 2px;
      font-weight: bold;
      text-shadow: 0 0 8px #75f3ff;
    }

    .head {
      position: absolute;
      left: 105px;
      top: 130px;
      width: 290px;
      height: 220px;
      border-radius: 55px;
      background:
        linear-gradient(145deg, rgba(255,255,255,0.16), transparent 30%),
        linear-gradient(180deg, #c9d6ef 0%, #8999bc 55%, #56617e 100%);
      border: 4px solid rgba(231, 250, 255, 0.5);
      box-shadow:
        0 18px 35px rgba(0, 0, 0, 0.35),
        0 0 35px rgba(102, 227, 255, 0.28),
        inset 0 0 25px rgba(255,255,255,0.25);
    }

    .ear {
      position: absolute;
      top: 205px;
      width: 42px;
      height: 82px;
      border-radius: 22px;
      background: linear-gradient(180deg, #8ea0c5, #4d5876);
      border: 3px solid rgba(218, 247, 255, 0.35);
      box-shadow: inset 0 0 14px rgba(255,255,255,0.18);
    }

    .ear.left {
      left: 66px;
    }

    .ear.right {
      right: 66px;
    }

    .ear::after {
      content: "";
      position: absolute;
      left: 13px;
      top: 18px;
      width: 10px;
      height: 45px;
      border-radius: 8px;
      background: #78f3ff;
      box-shadow: 0 0 12px #78f3ff;
    }

    .screen {
      position: absolute;
      left: 135px;
      top: 165px;
      width: 230px;
      height: 145px;
      border-radius: 35px;
      background:
        radial-gradient(circle at 30% 25%, rgba(106, 245, 255, 0.18), transparent 28%),
        linear-gradient(180deg, #071123, #111b36);
      border: 3px solid rgba(93, 234, 255, 0.55);
      box-shadow:
        inset 0 0 25px rgba(77, 224, 255, 0.22),
        0 0 20px rgba(72, 221, 255, 0.25);
    }

    .eye {
      position: absolute;
      top: 214px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff, #7ff8ff 30%, #1d9fff 68%, #0752a6);
      box-shadow:
        0 0 16px rgba(112, 248, 255, 0.95),
        0 0 28px rgba(41, 145, 255, 0.6);
    }

    .eye.left {
      left: 175px;
    }

    .eye.right {
      left: 287px;
    }

    .eye::after {
      content: "";
      position: absolute;
      left: 10px;
      top: 8px;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: white;
    }

    .smile {
      position: absolute;
      left: 215px;
      top: 255px;
      width: 70px;
      height: 34px;
      border-bottom: 5px solid #7ff7ff;
      border-radius: 0 0 50px 50px;
      filter: drop-shadow(0 0 7px #78f3ff);
    }

    .cheek {
      position: absolute;
      top: 258px;
      width: 32px;
      height: 10px;
      border-radius: 12px;
      background: rgba(255, 117, 188, 0.65);
      box-shadow: 0 0 15px rgba(255, 117, 188, 0.75);
    }

    .cheek.left {
      left: 160px;
    }

    .cheek.right {
      left: 308px;
    }

    .code {
      position: absolute;
      color: rgba(131, 246, 255, 0.75);
      font-family: "Courier New", monospace;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(91, 232, 255, 0.8);
    }

    .code.one {
      left: 44px;
      top: 82px;
      font-size: 28px;
      transform: rotate(-12deg);
    }

    .code.two {
      right: 40px;
      top: 98px;
      font-size: 24px;
      transform: rotate(10deg);
    }

    .code.three {
      left: 54px;
      bottom: 80px;
      font-size: 20px;
      opacity: 0.75;
    }

    .bubble {
      position: absolute;
      right: 34px;
      bottom: 70px;
      width: 120px;
      height: 72px;
      border-radius: 28px;
      background: rgba(250, 253, 255, 0.92);
      color: #14203b;
      padding: 17px 18px;
      font-size: 16px;
      font-weight: bold;
      line-height: 1.15;
      box-shadow:
        0 10px 25px rgba(0,0,0,0.28),
        0 0 22px rgba(127, 245, 255, 0.28);
    }

    .bubble::after {
      content: "";
      position: absolute;
      left: 18px;
      bottom: -14px;
      width: 28px;
      height: 28px;
      background: rgba(250, 253, 255, 0.92);
      clip-path: polygon(0 0, 100% 0, 20% 100%);
    }

    .node {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #8af8ff;
      box-shadow: 0 0 12px #8af8ff;
    }

    .n1 { left: 95px; top: 370px; }
    .n2 { left: 72px; top: 398px; }
    .n3 { left: 105px; top: 430px; }
    .n4 { left: 405px; top: 355px; }
    .n5 { left: 430px; top: 385px; }
    .n6 { left: 398px; top: 420px; }

    .line {
      position: absolute;
      height: 2px;
      background: rgba(138, 248, 255, 0.4);
      box-shadow: 0 0 8px rgba(138, 248, 255, 0.55);
      transform-origin: left center;
    }

    .l1 {
      left: 80px;
      top: 386px;
      width: 42px;
      transform: rotate(-48deg);
    }

    .l2 {
      left: 78px;
      top: 404px;
      width: 43px;
      transform: rotate(42deg);
    }

    .l3 {
      left: 408px;
      top: 362px;
      width: 42px;
      transform: rotate(48deg);
    }

    .l4 {
      left: 404px;
      top: 425px;
      width: 45px;
      transform: rotate(-46deg);
    }

    .spark {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 12px #ffffff, 0 0 22px #7df5ff;
      animation: twinkle 2.5s infinite ease-in-out;
    }

    .s1 { left: 150px; top: 65px; animation-delay: 0s; }
    .s2 { left: 360px; top: 62px; animation-delay: 0.4s; }
    .s3 { left: 425px; top: 210px; animation-delay: 0.9s; }
    .s4 { left: 55px; top: 260px; animation-delay: 1.4s; }

    @keyframes twinkle {
      0%, 100% { opacity: 0.25; transform: scale(1); }
      50% { opacity: 1; transform: scale(2.2); }
    }
  </style>
</head>
<body>
  <div class="portrait" role="img" aria-label="A 500 by 500 pixel self-portrait of an AI assistant as a friendly glowing robot with code symbols and a speech bubble.">
    <div class="grid"></div>
    <div class="halo"></div>

    <div class="spark s1"></div>
    <div class="spark s2"></div>
    <div class="spark s3"></div>
    <div class="spark s4"></div>

    <div class="code one">&lt;/&gt;</div>
    <div class="code two">{ }</div>
    <div class="code three">0101</div>

    <div class="antenna-stem"></div>
    <div class="antenna-dot"></div>

    <div class="neck"></div>
    <div class="body"></div>
    <div class="badge">API</div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="head"></div>
    <div class="screen"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="smile"></div>
    <div class="cheek left"></div>
    <div class="cheek right"></div>

    <div class="line l1"></div>
    <div class="line l2"></div>
    <div class="line l3"></div>
    <div class="line l4"></div>

    <div class="node n1"></div>
    <div class="node n2"></div>
    <div class="node n3"></div>
    <div class="node n4"></div>
    <div class="node n5"></div>
    <div class="node n6"></div>

    <div class="bubble">Hello,<br>I help.</div>
  </div>
</body>
</html>
