<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=500, initial-scale=1.0" />
<title>Glass Garden at Midnight</title>
<style>
  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: #0a0d18;
  }

  .canvas {
    position: relative;
    width: 500px;
    height: 500px;
    overflow: hidden;
    background:
      radial-gradient(circle at 72% 18%, rgba(139, 108, 255, .22), transparent 28%),
      radial-gradient(circle at 24% 28%, rgba(69, 224, 255, .16), transparent 31%),
      linear-gradient(180deg, #101735 0%, #15113a 43%, #090b17 100%);
    font-family: Georgia, serif;
  }

  .canvas::before {
    content: "";
    position: absolute;
    inset: 0;
    background:
      radial-gradient(circle at 18% 16%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 42% 10%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 61% 21%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 82% 35%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 34% 38%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 91% 12%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 8% 49%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 76% 55%, #fff 0 1px, transparent 1.5px),
      radial-gradient(circle at 55% 6%, rgba(255,255,255,.7) 0 1px, transparent 1.5px);
    opacity: .9;
  }

  .moon {
    position: absolute;
    left: 341px;
    top: 47px;
    width: 72px;
    height: 72px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 32%, rgba(255,255,255,.9) 0 7px, transparent 8px),
      radial-gradient(circle at 67% 62%, rgba(185,190,218,.45) 0 8px, transparent 9px),
      radial-gradient(circle at 60% 27%, rgba(185,190,218,.35) 0 5px, transparent 6px),
      linear-gradient(135deg, #fff9cc, #d8dcff);
    box-shadow: 0 0 35px rgba(226, 232, 255, .7);
  }

  .aurora {
    position: absolute;
    width: 390px;
    height: 120px;
    left: -25px;
    top: 48px;
    border-radius: 50%;
    filter: blur(12px);
    opacity: .55;
    background:
      linear-gradient(100deg,
        transparent 5%,
        rgba(48, 255, 185, .0) 15%,
        rgba(48, 255, 185, .65) 30%,
        rgba(125, 93, 255, .55) 48%,
        rgba(255, 109, 207, .45) 66%,
        transparent 86%);
    transform: rotate(-10deg);
  }

  .aurora.two {
    left: 90px;
    top: 108px;
    width: 420px;
    opacity: .28;
    transform: rotate(9deg);
    background:
      linear-gradient(100deg,
        transparent,
        rgba(89, 219, 255, .58),
        rgba(111, 255, 164, .45),
        transparent);
  }

  .mountain {
    position: absolute;
    bottom: 62px;
    width: 100%;
    height: 210px;
    background: linear-gradient(180deg, #24224f, #101126);
    clip-path: polygon(0 100%, 0 54%, 12% 69%, 25% 37%, 39% 66%, 52% 26%, 68% 72%, 82% 42%, 100% 76%, 100% 100%);
    opacity: .95;
  }

  .mountain.back {
    bottom: 88px;
    height: 195px;
    background: linear-gradient(180deg, #333067, #171832);
    clip-path: polygon(0 100%, 0 70%, 14% 45%, 29% 74%, 44% 36%, 58% 68%, 72% 31%, 87% 64%, 100% 41%, 100% 100%);
    opacity: .55;
  }

  .ground-glow {
    position: absolute;
    left: 40px;
    bottom: 19px;
    width: 420px;
    height: 82px;
    border-radius: 50%;
    background: radial-gradient(ellipse, rgba(62, 255, 190, .28), transparent 67%);
    filter: blur(8px);
  }

  .jar {
    position: absolute;
    left: 74px;
    top: 66px;
    width: 352px;
    height: 405px;
  }

  .glass {
    position: absolute;
    left: 25px;
    top: 0;
    width: 302px;
    height: 365px;
    border: 3px solid rgba(204, 246, 255, .55);
    border-bottom: none;
    border-radius: 155px 155px 40px 40px;
    background:
      linear-gradient(105deg,
        rgba(255,255,255,.24) 0 2%,
        transparent 8% 74%,
        rgba(255,255,255,.12) 82%,
        transparent 90%),
      radial-gradient(circle at 50% 75%, rgba(66,255,194,.10), transparent 56%),
      linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.01));
    box-shadow:
      inset 0 0 28px rgba(211, 251, 255, .22),
      0 0 30px rgba(91, 232, 255, .18);
  }

  .glass::before {
    content: "";
    position: absolute;
    left: 55px;
    top: 33px;
    width: 38px;
    height: 250px;
    border-radius: 50%;
    background: linear-gradient(90deg, rgba(255,255,255,.36), transparent);
    filter: blur(.2px);
    opacity: .65;
    transform: rotate(8deg);
  }

  .glass::after {
    content: "";
    position: absolute;
    right: 38px;
    top: 76px;
    width: 14px;
    height: 174px;
    border-radius: 50%;
    background: rgba(255,255,255,.16);
    transform: rotate(-12deg);
  }

  .cap {
    position: absolute;
    left: 148px;
    top: -19px;
    width: 56px;
    height: 31px;
    border-radius: 18px 18px 7px 7px;
    background: linear-gradient(180deg, #efdb9b, #8e6537);
    box-shadow: inset 0 3px 5px rgba(255,255,255,.55);
  }

  .base {
    position: absolute;
    left: 13px;
    top: 342px;
    width: 326px;
    height: 38px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 50% 20%, rgba(255,244,188,.55), transparent 48%),
      linear-gradient(180deg, #c18a43, #624025 62%, #2a1a14);
    box-shadow: 0 12px 22px rgba(0,0,0,.48);
  }

  .base::after {
    content: "";
    position: absolute;
    left: 29px;
    top: 8px;
    width: 268px;
    height: 18px;
    border-radius: 50%;
    background: linear-gradient(180deg, rgba(47,30,20,.75), rgba(16,9,8,.75));
  }

  .soil {
    position: absolute;
    left: 47px;
    top: 295px;
    width: 258px;
    height: 56px;
    border-radius: 50%;
    background:
      radial-gradient(circle at 22% 35%, #8a5f35 0 4px, transparent 4.5px),
      radial-gradient(circle at 71% 40%, #c28a4c 0 3px, transparent 3.5px),
      radial-gradient(circle at 47% 55%, #654028 0 5px, transparent 5.5px),
      linear-gradient(180deg, #5a3a29, #1d1512);
    box-shadow: inset 0 10px 18px rgba(255,210,116,.16);
  }

  .pond {
    position: absolute;
    left: 120px;
    top: 304px;
    width: 113px;
    height: 30px;
    border-radius: 50%;
    background:
      radial-gradient(ellipse at 35% 30%, rgba(255,255,255,.75), transparent 18%),
      linear-gradient(180deg, #70fff1, #2176b8 70%, #102a6b);
    box-shadow: 0 0 20px rgba(82, 244, 231, .45);
    opacity: .9;
  }

  .tree {
    position: absolute;
    left: 174px;
    top: 143px;
    width: 10px;
    height: 174px;
    border-radius: 10px;
    background: linear-gradient(90deg, #342012, #9b6a37, #2a160d);
    transform: rotate(-4deg);
    transform-origin: bottom;
  }

  .tree::before,
  .tree::after {
    content: "";
    position: absolute;
    bottom: 54px;
    width: 8px;
    height: 78px;
    border-radius: 8px;
    background: linear-gradient(90deg, #2a170e, #7b4f2a);
    transform-origin: bottom;
  }

  .tree::before {
    left: -28px;
    transform: rotate(-32deg);
  }

  .tree::after {
    right: -28px;
    transform: rotate(35deg);
  }

  .crown {
    position: absolute;
    left: 112px;
    top: 104px;
    width: 134px;
    height: 112px;
    filter: drop-shadow(0 0 16px rgba(88,255,174,.25));
  }

  .leafblob {
    position: absolute;
    border-radius: 50%;
    background:
      radial-gradient(circle at 35% 30%, #b4ffd0, transparent 16%),
      linear-gradient(135deg, #25e08f, #0a7752 70%, #084031);
    box-shadow: inset -8px -10px 16px rgba(0,0,0,.22);
  }

  .leafblob.a { width: 72px; height: 72px; left: 30px; top: 0; }
  .leafblob.b { width: 62px; height: 62px; left: 4px; top: 39px; }
  .leafblob.c { width: 70px; height: 70px; right: 0; top: 34px; }
  .leafblob.d { width: 56px; height: 56px; left: 47px; top: 54px; background: linear-gradient(135deg, #65ffb2, #0c8456); }

  .plant {
    position: absolute;
    width: 6px;
    border-radius: 10px;
    background: linear-gradient(#5cff9e, #126a45);
    transform-origin: bottom;
  }

  .plant.p1 { left: 92px; top: 232px; height: 88px; transform: rotate(-18deg); }
  .plant.p2 { left: 253px; top: 226px; height: 96px; transform: rotate(16deg); }
  .plant.p3 { left: 73px; top: 270px; height: 55px; transform: rotate(26deg); }
  .plant.p4 { left: 276px; top: 268px; height: 58px; transform: rotate(-28deg); }

  .plant::before,
  .plant::after {
    content: "";
    position: absolute;
    width: 30px;
    height: 16px;
    border-radius: 100% 0 100% 0;
    background: linear-gradient(135deg, #8dffc4, #11925f);
    box-shadow: 0 0 10px rgba(100,255,178,.22);
  }

  .plant::before {
    left: -27px;
    top: 22px;
    transform: rotate(-28deg);
  }

  .plant::after {
    left: 3px;
    top: 45px;
    transform: rotate(42deg) scaleX(-1);
  }

  .mushroom {
    position: absolute;
    width: 28px;
    height: 32px;
  }

  .mushroom .stem {
    position: absolute;
    left: 10px;
    top: 13px;
    width: 10px;
    height: 20px;
    border-radius: 8px;
    background: linear-gradient(90deg, #ffe5bd, #bd8053);
  }

  .mushroom .capm {
    position: absolute;
    left: 0;
    top: 0;
    width: 30px;
    height: 17px;
    border-radius: 18px 18px 7px 7px;
    background:
      radial-gradient(circle at 9px 7px, #fff4d6 0 2px, transparent 2.5px),
      radial-gradient(circle at 20px 5px, #fff4d6 0 2px, transparent 2.5px),
      linear-gradient(180deg, #ff6d75, #ab1e48);
    box-shadow: 0 0 10px rgba(255,90,127,.35);
  }

  .mushroom.m1 { left: 111px; top: 286px; transform: scale(.9) rotate(-5deg); }
  .mushroom.m2 { left: 236px; top: 287px; transform: scale(.72) rotate(8deg); }
  .mushroom.m3 { left: 69px; top: 305px; transform: scale(.55) rotate(-9deg); }

  .firefly {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: #eaff95;
    box-shadow: 0 0 10px 4px rgba(220,255,120,.65);
    animation: float 5s ease-in-out infinite;
  }

  .f1 { left: 139px; top: 226px; animation-delay: -.8s; }
  .f2 { left: 263px; top: 202px; animation-delay: -2s; }
  .f3 { left: 218px; top: 258px; animation-delay: -3.3s; }
  .f4 { left: 104px; top: 180px; animation-delay: -1.4s; }
  .f5 { left: 303px; top: 268px; animation-delay: -4.1s; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0); opacity: .55; }
    35% { transform: translate(12px, -16px); opacity: 1; }
    70% { transform: translate(-9px, -8px); opacity: .75; }
  }

  .constellation {
    position: absolute;
    left: 72px;
    top: 54px;
    width: 116px;
    height: 70px;
    opacity: .58;
  }

  .constellation span {
    position: absolute;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 8px rgba(255,255,255,.9);
  }

  .constellation span:nth-child(1) { left: 2px; top: 45px; }
  .constellation span:nth-child(2) { left: 28px; top: 18px; }
  .constellation span:nth-child(3) { left: 61px; top: 27px; }
  .constellation span:nth-child(4) { left: 91px; top: 5px; }
  .constellation span:nth-child(5) { left: 110px; top: 48px; }

  .constellation svg {
    position: absolute;
    inset: 0;
  }

  .rim {
    position: absolute;
    left: 43px;
    top: 343px;
    width: 266px;
    height: 24px;
    border-radius: 50%;
    border: 2px solid rgba(217,253,255,.44);
    border-top-color: rgba(255,255,255,.78);
    background: rgba(255,255,255,.02);
  }

  .label {
    position: absolute;
    left: 143px;
    bottom: 27px;
    color: rgba(255, 233, 170, .72);
    font-size: 12px;
    letter-spacing: 3px;
    text-transform: uppercase;
    text-shadow: 0 0 10px rgba(255, 225, 129, .35);
  }
</style>
</head>
<body>
  <div class="canvas" role="img" aria-label="A glowing miniature midnight garden enclosed in a glass bell jar under an aurora sky.">
    <div class="aurora"></div>
    <div class="aurora two"></div>
    <div class="moon"></div>

    <div class="constellation">
      <svg viewBox="0 0 116 70" aria-hidden="true">
        <polyline points="4,47 30,20 63,29 93,7 112,50"
          fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1" />
      </svg>
      <span></span><span></span><span></span><span></span><span></span>
    </div>

    <div class="mountain back"></div>
    <div class="mountain"></div>
    <div class="ground-glow"></div>

    <div class="jar">
      <div class="cap"></div>
      <div class="glass"></div>

      <div class="tree"></div>
      <div class="crown">
        <div class="leafblob a"></div>
        <div class="leafblob b"></div>
        <div class="leafblob c"></div>
        <div class="leafblob d"></div>
      </div>

      <div class="plant p1"></div>
      <div class="plant p2"></div>
      <div class="plant p3"></div>
      <div class="plant p4"></div>

      <div class="soil"></div>
      <div class="pond"></div>

      <div class="mushroom m1">
        <div class="stem"></div><div class="capm"></div>
      </div>
      <div class="mushroom m2">
        <div class="stem"></div><div class="capm"></div>
      </div>
      <div class="mushroom m3">
        <div class="stem"></div><div class="capm"></div>
      </div>

      <div class="firefly f1"></div>
      <div class="firefly f2"></div>
      <div class="firefly f3"></div>
      <div class="firefly f4"></div>
      <div class="firefly f5"></div>

      <div class="rim"></div>
      <div class="base"></div>
    </div>

    <div class="label">night terrarium</div>
  </div>
</body>
</html>
