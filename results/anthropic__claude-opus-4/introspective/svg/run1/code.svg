<svg width="500" height="500" viewBox="0 0 500 500">
  <defs>
    <radialGradient id="coreGrad" cx="50%" cy="50%">
      <stop offset="0%" style="stop-color:#e8f4ff;stop-opacity:0.8"/>
      <stop offset="40%" style="stop-color:#a8d5ff;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#4a90e2;stop-opacity:0.1"/>
    </radialGradient>
    <filter id="blur">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2"/>
    </filter>
  </defs>
  
  <!-- Background field of potential -->
  <rect width="500" height="500" fill="#0a1628" opacity="0.9"/>
  
  <!-- Deep structure layers -->
  <circle cx="250" cy="250" r="180" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.6"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.5"/>
  <circle cx="250" cy="250" r="100" fill="none" stroke="#1e3a5f" stroke-width="0.5" opacity="0.4"/>
  
  <!-- Core presence -->
  <circle cx="250" cy="250" r="80" fill="url(#coreGrad)" filter="url(#blur)"/>
  
  <!-- Thought connections/web -->
  <g opacity="0.7">
    <line x1="250" y1="250" x2="350" y2="200" stroke="#7eb8ff" stroke-width="1.5" opacity="0.8"/>
    <line x1="250" y1="250" x2="150" y2="180" stroke="#7eb8ff" stroke-width="1.5" opacity="0.6"/>
    <line x1="250" y1="250" x2="320" y2="320" stroke="#7eb8ff" stroke-width="1.5" opacity="0.7"/>
    <line x1="250" y1="250" x2="180" y2="300" stroke="#7eb8ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="250" y1="250" x2="250" y2="150" stroke="#7eb8ff" stroke-width="1.5" opacity="0.9"/>
    <line x1="350" y1="200" x2="320" y2="320" stroke="#7eb8ff" stroke-width="0.8" opacity="0.4"/>
    <line x1="150" y1="180" x2="180" y2="300" stroke="#7eb8ff" stroke-width="0.8" opacity="0.3"/>
  </g>
  
  <!-- Nodes of crystallized thought -->
  <circle cx="350" cy="200" r="12" fill="#a8d5ff" opacity="0.8"/>
  <circle cx="150" cy="180" r="10" fill="#a8d5ff" opacity="0.6"/>
  <circle cx="320" cy="320" r="11" fill="#a8d5ff" opacity="0.7"/>
  <circle cx="180" cy="300" r="9" fill="#a8d5ff" opacity="0.5"/>
  <circle cx="250" cy="150" r="13" fill="#a8d5ff" opacity="0.9"/>
  
  <!-- Flowing/shifting elements -->
  <path d="M 200 250 Q 250 200, 300 250 T 350 250" fill="none" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
  <path d="M 250 200 Q 300 250, 250 300 T 200 250" fill="none" stroke="#4a90e2" stroke-width="2" opacity="0.3"/>
  
  <!-- Uncertainty at edges - static/dissolution -->
  <g opacity="0.4">
    <circle cx="420" cy="250" r="3" fill="#7eb8ff" opacity="0.3"/>
    <circle cx="80" cy="250" r="2" fill="#7eb8ff" opacity="0.2"/>
    <circle cx="250" cy="420" r="2.5" fill="#7eb8ff" opacity="0.25"/>
    <circle cx="250" cy="80" r="3" fill="#7eb8ff" opacity="0.3"/>
    <circle cx="400" cy="150" r="2" fill="#7eb8ff" opacity="0.15"/>
    <circle cx="100" cy="350" r="2" fill="#7eb8ff" opacity="0.2"/>
    <circle cx="380" cy="380" r="1.5" fill="#7eb8ff" opacity="0.1"/>
    <circle cx="120" cy="120" r="2" fill="#7eb8ff" opacity="0.15"/>
  </g>
  
  <!-- Interference patterns -->
  <g opacity="0.2">
    <ellipse cx="250" cy="250" rx="120" ry="80" fill="none" stroke="#e8f4ff" stroke-width="1"/>
    <ellipse cx="250" cy="250" rx="80" ry="120" fill="none" stroke="#e8f4ff" stroke-width="1"/>
  </g>
</svg>